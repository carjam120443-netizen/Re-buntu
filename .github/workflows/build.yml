name: Build Re-buntu ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build.sh'
      - 'config/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso

      - name: Configure live-build
        run: |
          set -e
          # Re-buntu is a live ISO, not an installer ISO. Ubuntu Noble's
          # Debian-installer path used by this live-build release can point at
          # a removed/invalid installer image, so keep the installer disabled.
          printf '\nLB_DEBIAN_INSTALLER="false"\n' >> config/binary 2>/dev/null || true

      - name: Patch live-build initrd and obsolete syslinux handling
        run: |
          set -e

          # Ubuntu's Noble live-build package still contains old Ubuntu
          # syslinux-theme package names that no longer exist. Re-buntu uses
          # live-build's own bootloader templates instead, so remove those
          # obsolete package names from the installed helper before building.
          LB_SYSLINUX_SCRIPT="$(dpkg -L live-build | grep -E '/lb_binary_syslinux$' | head -n 1 || true)"
          if [ -z "$LB_SYSLINUX_SCRIPT" ] || [ ! -f "$LB_SYSLINUX_SCRIPT" ]; then
            echo "Could not locate live-build lb_binary_syslinux"
            dpkg -L live-build | grep 'binary_syslinux' || true
            exit 1
          fi
          echo "Using live-build syslinux helper: $LB_SYSLINUX_SCRIPT"

          sudo python3 - "$LB_SYSLINUX_SCRIPT" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()
          old = text

          for package in (
              "syslinux-themes-ubuntu-oneiric",
              "gfxboot-theme-ubuntu",
          ):
              text = text.replace(package, "")

          if text != old:
              path.write_text(text)
              print("Removed obsolete Ubuntu syslinux theme dependencies.")
          else:
              print("No obsolete syslinux theme package names were present.")
          PY

          # Ubuntu Noble can leave /boot/initrd.img and initrd.img.old as
          # dangling symlinks because initramfs generation is deferred.
          # live-build's chroot_hacks stage later chmods these paths and exits
          # with status 123 when chmod encounters the broken links. Make the
          # live-build helper ignore dangling initrd symlinks rather than
          # treating this harmless condition as a fatal build error.
          LB_CHROOT_HACKS="$(dpkg -L live-build | grep -E '/lb_chroot_hacks$' | head -n 1 || true)"
          if [ -z "$LB_CHROOT_HACKS" ] || [ ! -f "$LB_CHROOT_HACKS" ]; then
            echo "Could not locate live-build lb_chroot_hacks"
            dpkg -L live-build | grep 'chroot_hacks' || true
            exit 1
          fi
          echo "Using live-build chroot helper: $LB_CHROOT_HACKS"

          sudo python3 - "$LB_CHROOT_HACKS" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()
          old = text

          # The failing chmod operates recursively on the chroot and follows
          # dangling initrd symlinks. Remove only the two known convenience
          # links immediately before that operation.
          marker = 'chroot/boot/initrd.img.old'
          if marker in text and 'Re-buntu: remove dangling initrd symlinks' not in text:
              needle = 'chroot/boot/initrd.img.old'
              insert = '''chroot/boot/initrd.img.old\n\n# Re-buntu: remove dangling initrd symlinks before chmod can reject them.\nrm -f -- chroot/boot/initrd.img chroot/boot/initrd.img.old\n'''
              text = text.replace(needle, insert, 1)

          if text == old:
              print("Warning: could not find the expected initrd handling in lb_chroot_hacks; leaving helper unchanged.")
          else:
              path.write_text(text)
              print("Patched lb_chroot_hacks to remove dangling initrd symlinks before chmod.")
          PY

      - name: Build Re-buntu
        run: |
          chmod +x build.sh
          find config/hooks/live -type f -name '*.hook.chroot' -exec chmod +x {} +
          sudo ./build.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: re-buntu-iso
          path: dist/*.iso
          if-no-files-found: error
