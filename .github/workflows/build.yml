name: Build Re-buntu ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build.sh'
      - 'config/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build and dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso wget

          # Install Ubuntu's fixed live-build package. This avoids the Noble
          # lb_chroot_hacks dangling-initrd chmod failure.
          wget -q https://archive.ubuntu.com/ubuntu/pool/main/l/live-build/live-build_3.0~a57-1ubuntu56_all.deb -O /tmp/live-build.deb
          sudo apt-get install -y /tmp/live-build.deb
          live-build --version

      - name: Patch obsolete syslinux package references
        run: |
          set -e

          # lb_binary_syslinux can request old Ubuntu theme packages that no
          # longer exist in Noble. Remove the package names from the helper,
          # but do not alter the actual syslinux bootloader logic.
          LB_SYSLINUX_SCRIPT="$(dpkg -L live-build | grep -E '/lb_binary_syslinux$' | head -n 1 || true)"
          if [ -z "$LB_SYSLINUX_SCRIPT" ] || [ ! -f "$LB_SYSLINUX_SCRIPT" ]; then
            echo "Could not locate live-build lb_binary_syslinux"
            dpkg -L live-build | grep 'binary_syslinux' || true
            exit 1
          fi
          echo "Using live-build syslinux helper: $LB_SYSLINUX_SCRIPT"

          sudo python3 - "$LB_SYSLINUX_SCRIPT" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          packages = (
              "syslinux-themes-ubuntu-oneiric",
              "gfxboot-theme-ubuntu",
          )

          for package in packages:
              text = text.replace(package, "")

          path.write_text(text)
          print("Patched obsolete syslinux theme package references.")
          PY

      - name: Disable broken syslinux theme installation
        run: |
          set -e
          # The Noble helper may still execute an apt install even after the
          # package names are removed. Replace the theme-install package list
          # with an empty list while retaining the rest of syslinux setup.
          LB_SYSLINUX_SCRIPT="$(dpkg -L live-build | grep -E '/lb_binary_syslinux$' | head -n 1)"
          sudo python3 - "$LB_SYSLINUX_SCRIPT" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          old = text

          # Remove the obsolete package names wherever the helper constructs
          # the package installation list. The actual syslinux binaries are
          # still installed by live-build.
          for line in text.splitlines():
              if 'syslinux-themes-ubuntu-oneiric' in line or 'gfxboot-theme-ubuntu' in line:
                  text = text.replace(line, '')

          if text == old:
              print('No obsolete theme-install lines remain; continuing.')
          else:
              path.write_text(text)
              print('Removed obsolete theme-install lines.')
          PY

      - name: Configure live-build
        run: |
          set -e
          # Re-buntu is a live ISO, not an installer ISO.
          printf '\nLB_DEBIAN_INSTALLER="false"\n' >> config/binary 2>/dev/null || true

      - name: Build Re-buntu
        run: |
          chmod +x build.sh
          find config/hooks/live -type f -name '*.hook.chroot' -exec chmod +x {} +
          sudo ./build.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: re-buntu-iso
          path: dist/*.iso
          if-no-files-found: error
