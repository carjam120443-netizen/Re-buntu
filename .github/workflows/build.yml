name: Build Re-buntu ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build.sh'
      - 'config/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso

      - name: Patch live-build initrd permission handling
        run: |
          set -e
          LB_SCRIPT="$(dpkg -L live-build | grep -E '/(lb_)?chroot_hacks$' | head -n 1 || true)"
          if [ -z "$LB_SCRIPT" ]; then
            echo "Could not locate live-build chroot_hacks script"
            dpkg -L live-build | grep -E 'chroot.*hacks|lb_.*hacks' || true
            exit 1
          fi
          echo "Using live-build chroot_hacks: $LB_SCRIPT"
          sudo grep -n "initrd.img" "$LB_SCRIPT" || true
          sudo python3 - "$LB_SCRIPT" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()
          lines = text.splitlines()
          changed = False
          for i, line in enumerate(lines):
              if "chmod" in line and "chroot/boot/initrd.img" in line and "find" not in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[i] = indent + "find chroot/boot -maxdepth 1 -type f -name 'initrd.img*' -exec chmod a+r {} +"
                  changed = True
          if not changed:
              raise SystemExit("Could not find the live-build initrd chmod command to patch")
          path.write_text("\n".join(lines) + "\n")
          print("Patched live-build to chmod only real initrd files, not dangling symlinks.")
          PY

      - name: Build Re-buntu
        run: |
          chmod +x build.sh
          chmod +x config/hooks/live/*.hook.chroot
          sudo ./build.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: re-buntu-iso
          path: dist/*.iso
          if-no-files-found: error
