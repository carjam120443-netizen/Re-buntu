name: Build Re-buntu ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build.sh'
      - 'config/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso

      - name: Configure live-build
        run: |
          set -e
          # Re-buntu is a live ISO, not an installer ISO. Ubuntu Noble's
          # Debian-installer path used by this live-build release can point at
          # a removed/invalid installer image, so keep the installer disabled.
          printf '\nLB_DEBIAN_INSTALLER="false"\n' >> config/binary 2>/dev/null || true

      - name: Patch live-build initrd and obsolete syslinux handling
        run: |
          set -e

          # Ubuntu's Noble live-build package still contains old Ubuntu
          # syslinux-theme package names that no longer exist. Re-buntu uses
          # live-build's own bootloader templates instead, so remove those
          # obsolete package names from the installed helper before building.
          LB_SYSLINUX_SCRIPT="$(dpkg -L live-build | grep -E '/lb_binary_syslinux$' | head -n 1 || true)"
          if [ -z "$LB_SYSLINUX_SCRIPT" ] || [ ! -f "$LB_SYSLINUX_SCRIPT" ]; then
            echo "Could not locate live-build lb_binary_syslinux"
            dpkg -L live-build | grep 'binary_syslinux' || true
            exit 1
          fi
          echo "Using live-build syslinux helper: $LB_SYSLINUX_SCRIPT"

          sudo python3 - "$LB_SYSLINUX_SCRIPT" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()
          old = text

          # These packages were used by old Ubuntu live-build integrations but
          # are unavailable on current Noble. Keep syslinux itself intact.
          for package in (
              "syslinux-themes-ubuntu-oneiric",
              "gfxboot-theme-ubuntu",
          ):
              text = text.replace(package, "")

          if text != old:
              path.write_text(text)
              print("Removed obsolete Ubuntu syslinux theme dependencies.")
          else:
              print("No obsolete syslinux theme package names were present.")
          PY

      - name: Build Re-buntu
        run: |
          chmod +x build.sh
          find config/hooks/live -type f -name '*.hook.chroot' -exec chmod +x {} +
          sudo ./build.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: re-buntu-iso
          path: dist/*.iso
          if-no-files-found: error
